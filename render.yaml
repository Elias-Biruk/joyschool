services:
  - type: web
    name: joyschool-backend
    env: node
    plan: free
    buildCommand: cd backend && npm install && npm run build
    startCommand: cd backend && npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: OBSERVE_APP_KEY
        sync: false
      - key: OBSERVE_APP_SECRET
        sync: false
      - key: RATE_LIMIT_TTL
        value: 60000
      - key: RATE_LIMIT_LIMIT
        value: 10
    healthCheckPath: /api/health
